[package]
name = "mod-o-matic"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Mod-O-Matic"
path = "src/main.rs"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
image = "0.25.10"
rfd = "0.14"
affinity = "0.1.2"
rust-ini = "0.21"
infer = "0.16"
file-format = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[build-dependencies]
embed-resource = "2.4"
